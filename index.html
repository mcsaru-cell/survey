<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>担当者対応アンケート</title><style>* { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: Meiryo,sans-serif; background: #f4f6f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; } .card { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); max-width: 520px; width: 100%; padding: 40px 36px; } .header { text-align: center; margin-bottom: 32px; } .header h1 { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; } .header p { font-size: 13px; color: #888; } .question { margin-bottom: 28px; } .question label { display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 10px; } .question label .num { display: inline-block; background: #4f80e1; color: #fff; border-radius: 50%; width: 22px; height: 22px; line-height: 22px; text-align: center; font-size: 12px; margin-right: 8px; } .stars { display: flex; gap: 6px; flex-direction: row-reverse; justify-content: flex-end; } .stars input { display: none; } .stars label { font-size: 32px; color: #ddd; cursor: pointer; margin-bottom: 0; font-weight: normal; } .stars input:checked ~ label, .stars label:hover, .stars label:hover ~ label { color: #f5a623; } .radio-group { display: flex; gap: 10px; } .radio-group label { flex: 1; display: flex; align-items: center; justify-content: center; border: 2px solid #e0e4ed; border-radius: 10px; padding: 10px 8px; cursor: pointer; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 0; } .radio-group input[type=radio] { display: none; } .radio-group input[type=radio]:checked + label { border-color: #4f80e1; background: #eef2fb; color: #4f80e1; } textarea { width: 100%; border: 2px solid #e0e4ed; border-radius: 10px; padding: 12px 14px; font-size: 14px; font-family: inherit; color: #333; resize: vertical; min-height: 90px; outline: none; } .submit-btn { width: 100%; background: #4f80e1; color: #fff; border: none; border-radius: 12px; padding: 15px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; margin-top: 8px; } .note { text-align: center; font-size: 12px; color: #aaa; margin-top: 16px; } #thankyou { display: none; text-align: center; padding: 20px 0; } .divider { border: none; border-top: 1px solid #f0f0f0; margin: 24px 0; }</style></head><body><div class="card"><div id="form-area"><div class="header"><div style="font-size:40px;margin-bottom:12px">📋</div><h1>弊社担当安藤についてのアンケート</h1><p>弊社社員安藤についてお聞かせください（約1分）</p></div><form id="survey-form"><div class="question"><label><span class="num">1</span>安藤の対応は、全体的にいかがでしたか？</label><div class="stars"><input type="radio" name="q1" id="q1-5" value="5"><label for="q1-5">★</label><input type="radio" name="q1" id="q1-4" value="4"><label for="q1-4">★</label><input type="radio" name="q1" id="q1-3" value="3"><label for="q1-3">★</label><input type="radio" name="q1" id="q1-2" value="2"><label for="q1-2">★</label><input type="radio" name="q1" id="q1-1" value="1"><label for="q1-1">★</label></div></div><hr class="divider"><div class="question"><label><span class="num">2</span>説明はわかりやすかったですか？</label><div class="stars"><input type="radio" name="q2" id="q2-5" value="5"><label for="q2-5">★</label><input type="radio" name="q2" id="q2-4" value="4"><label for="q2-4">★</label><input type="radio" name="q2" id="q2-3" value="3"><label for="q2-3">★</label><input type="radio" name="q2" id="q2-2" value="2"><label for="q2-2">★</label><input type="radio" name="q2" id="q2-1" value="1"><label for="q2-1">★</label></div></div><hr class="divider"><div class="question"><label><span class="num">3</span>対応の速さはいかがでしたか？</label><div class="stars"><input type="radio" name="q3" id="q3-5" value="5"><label for="q3-5">★</label><input type="radio" name="q3" id="q3-4" value="4"><label for="q3-4">★</label><input type="radio" name="q3" id="q3-3" value="3"><label for="q3-3">★</label><input type="radio" name="q3" id="q3-2" value="2"><label for="q3-2">★</label><input type="radio" name="q3" id="q3-1" value="1"><label for="q3-1">★</label></div></div><hr class="divider"><div class="question"><label><span class="num">4</span>また安藤に担当してもらいたいですか？</label><div class="radio-group"><input type="radio" name="q4" id="q4-yes" value="yes"><label for="q4-yes">はい</label><input type="radio" name="q4" id="q4-neutral" value="neutral"><label for="q4-neutral">どちらでも</label><input type="radio" name="q4" id="q4-no" value="no"><label for="q4-no">いいえ</label></div></div><hr class="divider"><div class="question"><label><span class="num">5</span>ご意見・ご感想があればご記入ください（任意）</label><textarea name="q5" placeholder="自由にお書きください..."></textarea></div><button type="submit" class="submit-btn">送信する</button><p class="note">ご回答は匿名で処理されます</p></form></div><div id="thankyou"><div style="font-size:60px;margin-bottom:20px">🎉</div><h2 style="font-size:22px;color:#1a1a2e;margin-bottom:10px">ありがとうございました！</h2><p style="font-size:14px;color:#888;line-height:1.7">ご回答いただきありがとうございます。<br>いただいたご意見は今後のサービス改善に活用させていただきます。</p></div></div><script>document.getElementById('survey-form').addEventListener('submit',function(e){e.preventDefault();document.getElementById('form-area').style.display='none';document.getElementById('thankyou').style.display='block';});</script></body></html>
